services:
  - type: web
    name: birdlog
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: DB_TYPE
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SESSION_COOKIE_SAMESITE
        value: "None"
      - key: FRONTEND_ORIGIN
        sync: false
      - key: BIRDLOG_DATA_DIR
        value: /opt/render/project/src/data
    disk:
      name: birdlog-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
